name: Build PR 5903 APK

on:
  push:
    branches: [ "pr-5903" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build libhevtun (hev-socks5-tunnel)
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          export NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -r libs/* V2rayNG/app/libs/

      - name: Setup Go and Build libv2ray.aar from submodule
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Compile AndroidLibXrayLite
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          pushd AndroidLibXrayLite
          go mod tidy
          gomobile init
          gomobile bind -v -androidapi 24 -trimpath -ldflags='-s -w -buildid=' -o libv2ray.aar ./
          popd
          cp AndroidLibXrayLite/libv2ray.aar V2rayNG/app/libs/
          ls -laR V2rayNG/app/libs/

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-pr5903-debug-apks
          path: V2rayNG/app/build/outputs/apk/**/*.apk
