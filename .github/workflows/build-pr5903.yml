name: Build PR 5903 APK

on:
  push:
    branches: [ "pr-5903" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Download libv2ray.aar
        run: |
          mkdir -p V2rayNG/app/libs
          curl -sL $(curl -s https://api.github.com/repos/2dust/AndroidLibXrayLite/releases/latest | jq -r '.assets[] | select(.name == "libv2ray.aar") | .browser_download_url') -o V2rayNG/app/libs/libv2ray.aar
          ls -lh V2rayNG/app/libs/libv2ray.aar

      - name: Build Debug APK
        working-directory: ./V2rayNG
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-pr5903-debug-apks
          path: V2rayNG/app/build/outputs/apk/**/*.apk
